<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Xpra 输入验证</title>
<style>html,body{margin:0;box-sizing:border-box;width:100%;height:100%;font:20px sans-serif;background:#f4f7fc;color:#10243a}body{border:8px solid #17845b;padding:28px}textarea{display:block;width:90%;height:180px;font:24px sans-serif;margin:20px 0}footer{position:fixed;bottom:16px;right:24px}#echo{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Xpra 输入验证</h1><p>测试文字、小键盘、外部复制粘贴；绿色边框应完整显示。</p>
<textarea id="entry" aria-label="测试输入框" autofocus></textarea><p id="echo"></p><footer id="size"></footer>
<script>const entry=document.querySelector('#entry');entry.addEventListener('input',()=>{document.querySelector('#echo').textContent=entry.value;localStorage.setItem('xpra-test',entry.value)});function size(){document.querySelector('#size').textContent=innerWidth+' × '+innerHeight}addEventListener('resize',size);size();</script>
